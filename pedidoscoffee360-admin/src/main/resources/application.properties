spring.application.name=pedidoscoffee360-admin

#8081 para no chocar con el Producer (8888)
server.port=8081

#API HTTP de administracion de RabbitMQ (puerto 15672, no el 5672 de AMQP)
rabbit.admin.url=http://localhost:15672/api
rabbit.admin.vhost=/
rabbit.admin.username=${RABBIT_ADMIN_USER:guest}
rabbit.admin.password=${RABBIT_ADMIN_PASSWORD:guest}
